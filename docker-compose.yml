version: "3.9"

services:
  backend:
    container_name: images_api_backend
    restart: always
    build:
      context: .
    ports:
      - 8000:8000
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16.0-alpine3.18
    container_name: images_api_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2.1-alpine3.18
    container_name: images_api_redis
    restart: unless-stopped

  celery-worker:
    restart: always
    container_name: images_api_celery_worker
    build: .
    command: celery -A images_uploader_api worker -l info
    volumes:
      - .:/app
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
